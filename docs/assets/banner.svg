<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="ASTRÆA Citadel Observatory Banner">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05070E"/>
      <stop offset="45%" stop-color="#0B1024"/>
      <stop offset="100%" stop-color="#141938"/>
    </linearGradient>
    <radialGradient id="nebulaGold" cx="78%" cy="42%" r="48%">
      <stop offset="0%" stop-color="#D4AF37" stop-opacity="0.28"/>
      <stop offset="50%" stop-color="#B48A28" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#05070E" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="nebulaCyan" cx="22%" cy="68%" r="45%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.22"/>
      <stop offset="55%" stop-color="#4F46E5" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#05070E" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="45%" stop-color="#FDE68A"/>
      <stop offset="75%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#A5F3FC"/>
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4AF37" stop-opacity="0.85"/>
      <stop offset="50%" stop-color="#A5F3FC" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#D4AF37" stop-opacity="0.15"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Deep Space Backdrop -->
  <rect width="1200" height="320" rx="18" fill="url(#bgGrad)"/>
  <rect width="1200" height="320" rx="18" fill="url(#nebulaGold)"/>
  <rect width="1200" height="320" rx="18" fill="url(#nebulaCyan)"/>

  <!-- Subtle Astrometric Grid -->
  <g stroke="#94A3B8" stroke-opacity="0.06" stroke-width="1">
    <line x1="0" y1="80" x2="1200" y2="80"/>
    <line x1="0" y1="160" x2="1200" y2="160"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="200" y1="0" x2="200" y2="320"/>
    <line x1="400" y1="0" x2="400" y2="320"/>
    <line x1="600" y1="0" x2="600" y2="320"/>
    <line x1="800" y1="0" x2="800" y2="320"/>
    <line x1="1000" y1="0" x2="1000" y2="320"/>
  </g>

  <!-- Starfield Pinpricks -->
  <g fill="#FFFFFF">
    <circle cx="95" cy="48" r="1.4" opacity="0.85"/>
    <circle cx="164" cy="112" r="1.0" opacity="0.6"/>
    <circle cx="248" cy="36" r="1.8" fill="#A5F3FC" opacity="0.9"/>
    <circle cx="312" cy="272" r="1.2" opacity="0.65"/>
    <circle cx="430" cy="54" r="1.1" opacity="0.55"/>
    <circle cx="520" cy="285" r="1.5" fill="#FDE68A" opacity="0.8"/>
    <circle cx="670" cy="42" r="1.2" opacity="0.6"/>
    <circle cx="745" cy="268" r="1.6" fill="#A5F3FC" opacity="0.75"/>
    <circle cx="885" cy="58" r="1.3" opacity="0.7"/>
    <circle cx="1115" cy="72" r="1.9" fill="#FDE68A" opacity="0.9"/>
    <circle cx="1142" cy="242" r="1.2" opacity="0.6"/>
    <circle cx="58" cy="238" r="1.5" fill="#D4AF37" opacity="0.75"/>
  </g>

  <!-- Right-Side Astrolabe & Exoplanet Transit Emblem -->
  <g transform="translate(970, 160)">
    <circle cx="0" cy="0" r="112" fill="none" stroke="url(#ringGrad)" stroke-width="1.5" stroke-dasharray="6 5"/>
    <circle cx="0" cy="0" r="88" fill="none" stroke="#A5F3FC" stroke-opacity="0.32" stroke-width="1"/>
    <ellipse cx="0" cy="0" rx="128" ry="42" transform="rotate(-22)" fill="none" stroke="#D4AF37" stroke-opacity="0.55" stroke-width="1.5"/>
    <ellipse cx="0" cy="0" rx="128" ry="42" transform="rotate(28)" fill="none" stroke="#38BDF8" stroke-opacity="0.35" stroke-width="1"/>
    <!-- Host Star -->
    <circle cx="0" cy="0" r="34" fill="#FDE68A" filter="url(#glow)"/>
    <circle cx="0" cy="0" r="24" fill="#D4AF37"/>
    <circle cx="-7" cy="-7" r="9" fill="#FFFBEB" opacity="0.85"/>
    <!-- Transiting Exoplanet -->
    <circle cx="72" cy="-28" r="10" fill="#0F172A" stroke="#A5F3FC" stroke-width="2" filter="url(#glow)"/>
    <circle cx="72" cy="-28" r="4" fill="#38BDF8" opacity="0.7"/>
    <!-- Secondary Orbiting Body -->
    <circle cx="-86" cy="38" r="5.5" fill="#C084FC" filter="url(#glow)"/>
  </g>

  <!-- Left Content -->
  <g transform="translate(56, 48)">
    <!-- Top Pill -->
    <rect x="0" y="0" width="372" height="28" rx="14" fill="#1E293B" fill-opacity="0.75" stroke="#D4AF37" stroke-opacity="0.5" stroke-width="1"/>
    <circle cx="18" cy="14" r="4.5" fill="#10B981" filter="url(#glow)"/>
    <text x="32" y="18" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" font-weight="700" fill="#FDE68A" letter-spacing="1.2">CITADEL OBSERVATORY // MISSION CONTROL</text>

    <!-- Main Title -->
    <text x="0" y="96" font-family="Georgia, 'Times New Roman', serif" font-size="64" font-weight="900" fill="url(#titleGrad)" letter-spacing="4">ASTRÆA</text>
    <text x="2" y="128" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="20" font-weight="600" fill="#E2E8F0" letter-spacing="0.4">Exoplanet Vetting, Habitability Physics &amp; Sky Change Explorer</text>

    <!-- Description -->
    <text x="2" y="158" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="13.5" fill="#94A3B8">SPHEREx 102-Channel Spectrophotometry  •  TESS/Kepler Transit Pipeline  •  LightGBM + TreeSHAP XAI</text>

    <!-- Metric Badges -->
    <g transform="translate(0, 184)">
      <rect x="0" y="0" width="148" height="44" rx="10" fill="#0F172A" fill-opacity="0.88" stroke="#D4AF37" stroke-opacity="0.45"/>
      <text x="14" y="17" font-family="system-ui, sans-serif" font-size="10" fill="#94A3B8" font-weight="600">REAL TARGETS</text>
      <text x="14" y="35" font-family="ui-monospace, monospace" font-size="16" fill="#FDE68A" font-weight="700">14,727 Rows</text>

      <rect x="162" y="0" width="152" height="44" rx="10" fill="#0F172A" fill-opacity="0.88" stroke="#38BDF8" stroke-opacity="0.45"/>
      <text x="176" y="17" font-family="system-ui, sans-serif" font-size="10" fill="#94A3B8" font-weight="600">VETTING ROC-AUC</text>
      <text x="176" y="35" font-family="ui-monospace, monospace" font-size="16" fill="#A5F3FC" font-weight="700">0.977 (LGBM)</text>

      <rect x="328" y="0" width="164" height="44" rx="10" fill="#0F172A" fill-opacity="0.88" stroke="#A78BFA" stroke-opacity="0.45"/>
      <text x="342" y="17" font-family="system-ui, sans-serif" font-size="10" fill="#94A3B8" font-weight="600">SPECTRAL ENGINE</text>
      <text x="342" y="35" font-family="ui-monospace, monospace" font-size="16" fill="#DDD6FE" font-weight="700">102-Ch SPHEREx</text>

      <rect x="506" y="0" width="168" height="44" rx="10" fill="#0F172A" fill-opacity="0.88" stroke="#34D399" stroke-opacity="0.45"/>
      <text x="520" y="17" font-family="system-ui, sans-serif" font-size="10" fill="#94A3B8" font-weight="600">TESS FINE-TUNE</text>
      <text x="520" y="35" font-family="ui-monospace, monospace" font-size="16" fill="#6EE7B7" font-weight="700">0.952 ROC-AUC</text>
    </g>
  </g>

  <!-- Outer Crisp Border -->
  <rect x="1" y="1" width="1198" height="318" rx="17" fill="none" stroke="#D4AF37" stroke-opacity="0.35" stroke-width="1.5"/>
</svg>
