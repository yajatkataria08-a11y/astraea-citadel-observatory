<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 360" width="1200" height="360">
<defs>
  <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1" gradientUnits="objectBoundingBox">
    <stop offset="0%" stop-color="#040812"/>
    <stop offset="50%" stop-color="#0D1830"/>
    <stop offset="100%" stop-color="#040812"/>
  </linearGradient>
  <radialGradient id="nebL" cx="22%" cy="45%" r="30%" gradientUnits="userSpaceOnUse">
    <stop offset="0%" stop-color="#2D1B69" stop-opacity="0.65"/>
    <stop offset="100%" stop-color="#040812" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="nebR" cx="78%" cy="55%" r="28%" gradientUnits="userSpaceOnUse">
    <stop offset="0%" stop-color="#0E3A5C" stop-opacity="0.55"/>
    <stop offset="100%" stop-color="#040812" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="centerGlow" cx="600" cy="180" r="280" gradientUnits="userSpaceOnUse">
    <stop offset="0%" stop-color="#D4AF37" stop-opacity="0.04"/>
    <stop offset="100%" stop-color="#040812" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="goldShimmer" x1="0" y1="0" x2="1200" y2="0" gradientUnits="userSpaceOnUse">
    <stop offset="0%" stop-color="#8B7355"/>
    <stop offset="30%" stop-color="#C8A842"/>
    <stop offset="50%" stop-color="#F5E97A"/>
    <stop offset="70%" stop-color="#C8A842"/>
    <stop offset="100%" stop-color="#8B7355"/>
    <animateTransform attributeName="gradientTransform" type="translate" from="-600 0" to="600 0" dur="4s" repeatCount="indefinite"/>
  </linearGradient>
  <linearGradient id="cyanLine" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#A5F3FC" stop-opacity="0"/>
    <stop offset="30%" stop-color="#A5F3FC" stop-opacity="0.6"/>
    <stop offset="70%" stop-color="#A5F3FC" stop-opacity="0.6"/>
    <stop offset="100%" stop-color="#A5F3FC" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#D4AF37" stop-opacity="0"/>
    <stop offset="15%" stop-color="#D4AF37" stop-opacity="0.6"/>
    <stop offset="50%" stop-color="#A5F3FC" stop-opacity="0.4"/>
    <stop offset="85%" stop-color="#D4AF37" stop-opacity="0.6"/>
    <stop offset="100%" stop-color="#D4AF37" stop-opacity="0"/>
  </linearGradient>
  <filter id="goldGlow" x="-30%" y="-30%" width="160%" height="160%">
    <feGaussianBlur in="SourceAlpha" stdDeviation="5" result="blur"/>
    <feFlood flood-color="#D4AF37" flood-opacity="0.6" result="color"/>
    <feComposite in="color" in2="blur" operator="in" result="shadow"/>
    <feMerge><feMergeNode in="shadow"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <style>
    @keyframes twA { 0%,100%{opacity:.1} 50%{opacity:.95} }
    @keyframes twB { 0%,100%{opacity:.6} 50%{opacity:.1} }
    @keyframes twC { 0%{opacity:.5} 33%{opacity:.95} 66%{opacity:.15} 100%{opacity:.5} }
    @keyframes nebPulse { 0%,100%{opacity:.6} 50%{opacity:1} }
    @keyframes titleGlow { 0%,100%{filter:drop-shadow(0 0 8px #D4AF3770)} 50%{filter:drop-shadow(0 0 28px #D4AF37C0) drop-shadow(0 0 56px #D4AF3740)} }
    @keyframes subtitlePulse { 0%,100%{opacity:.5} 50%{opacity:1} }
    @keyframes b1 { 0%,100%{opacity:.7;transform:translateY(0)} 50%{opacity:1;transform:translateY(-2px)} }
    @keyframes b2 { 0%,100%{opacity:.65;transform:translateY(0)} 50%{opacity:1;transform:translateY(-2px)} }
    @keyframes b3 { 0%,100%{opacity:.7;transform:translateY(0)} 50%{opacity:1;transform:translateY(-2px)} }
    @keyframes b4 { 0%,100%{opacity:.65;transform:translateY(0)} 50%{opacity:1;transform:translateY(-2px)} }
    @keyframes borderAnim { 0%,100%{opacity:.4} 50%{opacity:.85} }
    @keyframes crossPulse { 0%,100%{stroke-opacity:.2} 50%{stroke-opacity:.6} }
    @keyframes dotPulse { 0%,100%{opacity:.4} 50%{opacity:1} }
    @keyframes taglineIn { from{opacity:0} to{opacity:1} }
  </style>
</defs>

<!-- BG -->
