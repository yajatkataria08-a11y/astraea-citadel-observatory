    <animate attributeName="r" values="22;24;22" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle r="18" fill="none" stroke="#D4AF37" stroke-width=".5" stroke-opacity=".4"/>
  <text text-anchor="middle" dy=".35em" fill="#D4AF37" font-size="20" font-family="Georgia,serif">✦</text>
  <!-- Orbiting dot on inner ring -->
  <circle r="3" fill="#D4AF37" opacity=".9">
    <animateMotion dur="8s" repeatCount="indefinite">
      <mpath xlink:href="#op1"/>
    </animateMotion>
  </circle>
  <circle r="2" fill="#A5F3FC" opacity=".75">
    <animateMotion dur="13s" repeatCount="indefinite" begin="4s">
      <mpath xlink:href="#op2"/>
    </animateMotion>
  </circle>
  <path id="op1" d="M0,-62 a62,62 0 1,1 -.01,0" fill="none"/>
  <path id="op2" d="M0,-80 a80,80 0 1,0 -.01,0" fill="none"/>
