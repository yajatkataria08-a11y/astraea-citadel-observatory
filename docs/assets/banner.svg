    <circle r="80" fill="none" stroke="#D4AF37" stroke-width=".8" stroke-opacity=".3" stroke-dasharray="4 8"/>
  </g>
  <!-- Static inner rings -->
  <circle r="62" fill="none" stroke="#A5F3FC" stroke-width=".6" stroke-opacity=".3"/>
  <!-- Crosshairs -->
  <line x1="-100" y1="0" x2="100" y2="0" stroke="#D4AF37" stroke-width=".5" style="animation:crossPulse 4s ease-in-out infinite"/>
