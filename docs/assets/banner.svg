<rect width="1200" height="360" fill="url(#nebL)" style="animation:nebPulse 7s ease-in-out infinite"/>
<rect width="1200" height="360" fill="url(#nebR)" style="animation:nebPulse 9s ease-in-out infinite 1.5s"/>
