    <line x1="-84.3" y1="17.3" x2="-94.6" y2="19.4" stroke="#D4AF37" stroke-width="1.5" stroke-opacity=".8"/>
    <line x1="-84.3" y1="-4.7" x2="-94.6" y2="-5.3" stroke="#D4AF37" stroke-width=".8" stroke-opacity=".5"/>
