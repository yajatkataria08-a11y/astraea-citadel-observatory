<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="1200" height="380">
<defs>
  <linearGradient id="qsbg" x1="0" y1="0" x2="0" y2="1" gradientUnits="objectBoundingBox">
    <stop offset="0%" stop-color="#07101E"/>
    <stop offset="100%" stop-color="#040812"/>
  </linearGradient>
  <style>
    @keyframes stepIn { from{opacity:0;transform:translateX(-20px)} to{opacity:1;transform:translateX(0)} }
    @keyframes numPulse { 0%,100%{opacity:.7;transform:scale(1)} 50%{opacity:1;transform:scale(1.08)} }
    @keyframes termBlink { 0%,49%{opacity:1} 50%,100%{opacity:0} }
    @keyframes borderP { 0%,100%{opacity:.3} 50%{opacity:.7} }
    @keyframes arrowFlow { 0%,100%{opacity:.3} 50%{opacity:.9} }
    @keyframes checkIn { from{opacity:0;transform:scale(0)} to{opacity:1;transform:scale(1)} }
  </style>
</defs>

<!-- BG -->
<rect width="1200" height="380" fill="url(#qsbg)"/>
<rect x="1" y="1" width="1198" height="378" rx="8" fill="none" stroke="#34D399" stroke-width=".8" stroke-opacity=".2" style="animation:borderP 4s ease-in-out infinite"/>

<!-- HEADER -->
<rect width="1200" height="52" fill="#060F1C"/>
<line x1="0" y1="52" x2="1200" y2="52" stroke="#34D399" stroke-width=".5" stroke-opacity=".3"/>
<text x="24" y="22" fill="#34D399" font-size="11" font-family="ui-monospace,monospace" letter-spacing="2">QUICK START</text>
<text x="24" y="41" fill="#475569" font-size="10" font-family="ui-monospace,monospace">Get ASTRÆA running in under 3 minutes · Windows &amp; Linux/macOS</text>
<text x="1176" y="32" text-anchor="end" fill="#94A3B8" font-size="9" font-family="ui-monospace,monospace">Python 3.10+  ·  Node.js 18+</text>

<!-- 6 steps: 2 rows × 3 cols -->

<!-- STEP 1: Clone -->
<g opacity="0" style="animation:stepIn .4s .3s ease-out forwards">
  <rect x="20" y="68" width="360" height="120" rx="8" fill="#071320" stroke="#334155" stroke-width=".8"/>
  <!-- Number badge -->
  <circle cx="48" cy="96" r="16" fill="#D4AF37" opacity=".15" style="animation:numPulse 2.5s ease-in-out infinite"/>
  <text x="48" y="101" text-anchor="middle" fill="#D4AF37" font-size="16" font-family="ui-monospace,monospace" font-weight="700">1</text>
  <!-- Title -->
  <text x="72" y="88" fill="#E2E8F0" font-size="12" font-family="system-ui,sans-serif" font-weight="600">📦 Clone Repository</text>
  <text x="72" y="103" fill="#64748B" font-size="9" font-family="ui-monospace,monospace">GitHub · HTTPS</text>
  <!-- Terminal box -->
  <rect x="28" y="112" width="344" height="66" rx="5" fill="#030810"/>
  <rect x="28" y="112" width="344" height="16" rx="5" fill="#0A1628"/>
  <circle cx="40" cy="120" r="3" fill="#F87171" opacity=".7"/>
  <circle cx="52" cy="120" r="3" fill="#FCD34D" opacity=".7"/>
  <circle cx="64" cy="120" r="3" fill="#34D399" opacity=".7"/>
  <text x="80" y="123" fill="#475569" font-size="8" font-family="ui-monospace,monospace">bash</text>
  <text x="36" y="143" fill="#A5F3FC" font-size="10" font-family="ui-monospace,monospace">$</text>
  <text x="48" y="143" fill="#E2E8F0" font-size="10" font-family="ui-monospace,monospace">git clone https://github.com/</text>
  <text x="48" y="157" fill="#E2E8F0" font-size="10" font-family="ui-monospace,monospace">  yajatkataria08-a11y/astraea-citadel</text>
  <text x="216" y="157" fill="#34D399" font-size="10" font-family="ui-monospace,monospace" style="animation:termBlink 1s infinite">▌</text>
</g>

<!-- Arrow 1→2 -->
<text x="395" y="134" fill="#334155" font-size="20" font-family="system-ui" style="animation:arrowFlow 1.5s ease-in-out infinite .5s">→</text>

<!-- STEP 2: Backend deps -->
<g opacity="0" style="animation:stepIn .4s .55s ease-out forwards">
  <rect x="420" y="68" width="360" height="120" rx="8" fill="#071320" stroke="#334155" stroke-width=".8"/>
  <circle cx="448" cy="96" r="16" fill="#A5F3FC" opacity=".1" style="animation:numPulse 2.5s ease-in-out infinite .3s"/>
  <text x="448" y="101" text-anchor="middle" fill="#A5F3FC" font-size="16" font-family="ui-monospace,monospace" font-weight="700">2</text>
  <text x="472" y="88" fill="#E2E8F0" font-size="12" font-family="system-ui,sans-serif" font-weight="600">🐍 Install Backend</text>
  <text x="472" y="103" fill="#64748B" font-size="9" font-family="ui-monospace,monospace">Python venv · pip</text>
  <rect x="428" y="112" width="344" height="66" rx="5" fill="#030810"/>
  <rect x="428" y="112" width="344" height="16" rx="5" fill="#0A1628"/>
  <circle cx="440" cy="120" r="3" fill="#F87171" opacity=".7"/>
  <circle cx="452" cy="120" r="3" fill="#FCD34D" opacity=".7"/>
  <circle cx="464" cy="120" r="3" fill="#34D399" opacity=".7"/>
  <text x="436" y="143" fill="#A5F3FC" font-size="10" font-family="ui-monospace,monospace">$</text>
  <text x="448" y="143" fill="#E2E8F0" font-size="10" font-family="ui-monospace,monospace">cd backend</text>
  <text x="436" y="157" fill="#A5F3FC" font-size="10" font-family="ui-monospace,monospace">$</text>
  <text x="448" y="157" fill="#E2E8F0" font-size="10" font-family="ui-monospace,monospace">pip install -r requirements.txt</text>
</g>

<!-- Arrow 2→3 -->
<text x="795" y="134" fill="#334155" font-size="20" font-family="system-ui" style="animation:arrowFlow 1.5s ease-in-out infinite 1s">→</text>

<!-- STEP 3: Start backend -->
<g opacity="0" style="animation:stepIn .4s .8s ease-out forwards">
  <rect x="820" y="68" width="360" height="120" rx="8" fill="#071320" stroke="#334155" stroke-width=".8"/>
  <circle cx="848" cy="96" r="16" fill="#34D399" opacity=".1" style="animation:numPulse 2.5s ease-in-out infinite .6s"/>
  <text x="848" y="101" text-anchor="middle" fill="#34D399" font-size="16" font-family="ui-monospace,monospace" font-weight="700">3</text>
  <text x="872" y="88" fill="#E2E8F0" font-size="12" font-family="system-ui,sans-serif" font-weight="600">⚡ Start Backend</text>
  <text x="872" y="103" fill="#64748B" font-size="9" font-family="ui-monospace,monospace">FastAPI · port 8000</text>
  <rect x="828" y="112" width="344" height="66" rx="5" fill="#030810"/>
  <rect x="828" y="112" width="344" height="16" rx="5" fill="#0A1628"/>
  <circle cx="840" cy="120" r="3" fill="#F87171" opacity=".7"/>
  <circle cx="852" cy="120" r="3" fill="#FCD34D" opacity=".7"/>
  <circle cx="864" cy="120" r="3" fill="#34D399" opacity=".7"/>
  <text x="836" y="143" fill="#A5F3FC" font-size="10" font-family="ui-monospace,monospace">$</text>
  <text x="848" y="143" fill="#E2E8F0" font-size="10" font-family="ui-monospace,monospace">cp .env.example .env</text>
  <text x="836" y="157" fill="#A5F3FC" font-size="10" font-family="ui-monospace,monospace">$</text>
  <text x="848" y="157" fill="#E2E8F0" font-size="10" font-family="ui-monospace,monospace">python run.py</text>
  <text x="996" y="157" fill="#34D399" font-size="10" font-family="ui-monospace,monospace" style="animation:termBlink 1s .4s infinite">▌</text>
</g>

<!-- ROW 2 -->

<!-- Arrow down -->
<text x="390" y="225" fill="#334155" font-size="16" font-family="system-ui" style="animation:arrowFlow 1.5s ease-in-out infinite 1.5s">↓</text>

<!-- STEP 4: Frontend deps -->
<g opacity="0" style="animation:stepIn .4s 1.05s ease-out forwards">
  <rect x="20" y="230" width="360" height="120" rx="8" fill="#071320" stroke="#334155" stroke-width=".8"/>
  <circle cx="48" cy="258" r="16" fill="#C084FC" opacity=".1" style="animation:numPulse 2.5s ease-in-out infinite .9s"/>
  <text x="48" y="263" text-anchor="middle" fill="#C084FC" font-size="16" font-family="ui-monospace,monospace" font-weight="700">4</text>
  <text x="72" y="250" fill="#E2E8F0" font-size="12" font-family="system-ui,sans-serif" font-weight="600">📦 Install Frontend</text>
  <text x="72" y="265" fill="#64748B" font-size="9" font-family="ui-monospace,monospace">Next.js 15 · npm</text>
  <rect x="28" y="274" width="344" height="66" rx="5" fill="#030810"/>
  <rect x="28" y="274" width="344" height="16" rx="5" fill="#0A1628"/>
  <circle cx="40" cy="282" r="3" fill="#F87171" opacity=".7"/>
  <circle cx="52" cy="282" r="3" fill="#FCD34D" opacity=".7"/>
  <circle cx="64" cy="282" r="3" fill="#34D399" opacity=".7"/>
  <text x="36" y="305" fill="#A5F3FC" font-size="10" font-family="ui-monospace,monospace">$</text>
  <text x="48" y="305" fill="#E2E8F0" font-size="10" font-family="ui-monospace,monospace">cd ../frontend</text>
  <text x="36" y="319" fill="#A5F3FC" font-size="10" font-family="ui-monospace,monospace">$</text>
  <text x="48" y="319" fill="#E2E8F0" font-size="10" font-family="ui-monospace,monospace">npm install</text>
</g>

<!-- Arrow 4→5 -->
<text x="395" y="296" fill="#334155" font-size="20" font-family="system-ui" style="animation:arrowFlow 1.5s ease-in-out infinite 2s">→</text>

<!-- STEP 5: Start frontend -->
<g opacity="0" style="animation:stepIn .4s 1.3s ease-out forwards">
  <rect x="420" y="230" width="360" height="120" rx="8" fill="#071320" stroke="#334155" stroke-width=".8"/>
  <circle cx="448" cy="258" r="16" fill="#FB923C" opacity=".1" style="animation:numPulse 2.5s ease-in-out infinite 1.2s"/>
  <text x="448" y="263" text-anchor="middle" fill="#FB923C" font-size="16" font-family="ui-monospace,monospace" font-weight="700">5</text>
  <text x="472" y="250" fill="#E2E8F0" font-size="12" font-family="system-ui,sans-serif" font-weight="600">🚀 Start Frontend</text>
  <text x="472" y="265" fill="#64748B" font-size="9" font-family="ui-monospace,monospace">Next.js dev server · port 3000</text>
  <rect x="428" y="274" width="344" height="66" rx="5" fill="#030810"/>
  <rect x="428" y="274" width="344" height="16" rx="5" fill="#0A1628"/>
  <circle cx="440" cy="282" r="3" fill="#F87171" opacity=".7"/>
  <circle cx="452" cy="282" r="3" fill="#FCD34D" opacity=".7"/>
  <circle cx="464" cy="282" r="3" fill="#34D399" opacity=".7"/>
  <text x="436" y="305" fill="#A5F3FC" font-size="10" font-family="ui-monospace,monospace">$</text>
  <text x="448" y="305" fill="#E2E8F0" font-size="10" font-family="ui-monospace,monospace">npm run dev</text>
  <text x="436" y="319" fill="#34D399" font-size="10" font-family="ui-monospace,monospace">▶</text>
  <text x="450" y="319" fill="#34D399" font-size="10" font-family="ui-monospace,monospace">Ready on http://localhost:3000</text>
</g>

<!-- Arrow 5→6 -->
<text x="795" y="296" fill="#334155" font-size="20" font-family="system-ui" style="animation:arrowFlow 1.5s ease-in-out infinite 2.5s">→</text>

<!-- STEP 6: Open browser -->
<g opacity="0" style="animation:stepIn .4s 1.55s ease-out forwards">
  <rect x="820" y="230" width="360" height="120" rx="8" fill="#071320" stroke="#34D399" stroke-width=".8" stroke-opacity=".5"/>
  <circle cx="848" cy="258" r="16" fill="#34D399" opacity=".2" style="animation:numPulse 2.5s ease-in-out infinite 1.5s"/>
  <text x="848" y="263" text-anchor="middle" fill="#34D399" font-size="16" font-family="ui-monospace,monospace" font-weight="700">6</text>
  <text x="872" y="250" fill="#E2E8F0" font-size="12" font-family="system-ui,sans-serif" font-weight="600">🌐 Open Observatory</text>
  <text x="872" y="265" fill="#64748B" font-size="9" font-family="ui-monospace,monospace">Mission Control ready</text>
  <rect x="828" y="274" width="344" height="66" rx="5" fill="#030810"/>
  <rect x="828" y="274" width="344" height="16" rx="5" fill="#051A10"/>
  <circle cx="840" cy="282" r="3" fill="#F87171" opacity=".7"/>
  <circle cx="852" cy="282" r="3" fill="#FCD34D" opacity=".7"/>
  <circle cx="864" cy="282" r="3" fill="#34D399" opacity=".7"/>
  <text x="836" y="305" fill="#34D399" font-size="10" font-family="ui-monospace,monospace">✓</text>
  <text x="850" y="305" fill="#E2E8F0" font-size="10" font-family="ui-monospace,monospace">http://localhost:3000</text>
  <text x="836" y="319" fill="#34D399" font-size="10" font-family="ui-monospace,monospace">✓</text>
  <text x="850" y="319" fill="#E2E8F0" font-size="10" font-family="ui-monospace,monospace">Backend: http://localhost:8000/health</text>
  <!-- Checkmark animation -->
  <circle cx="1148" cy="258" r="14" fill="#34D399" opacity=".15" style="animation:numPulse 2s ease-in-out infinite"/>
  <text x="1148" y="263" text-anchor="middle" fill="#34D399" font-size="14">✓</text>
</g>
</svg>
