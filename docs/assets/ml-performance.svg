<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" width="1200" height="440">
<defs>
  <linearGradient id="mlbg" x1="0" y1="0" x2="0" y2="1" gradientUnits="objectBoundingBox">
    <stop offset="0%" stop-color="#07101E"/>
    <stop offset="100%" stop-color="#040812"/>
  </linearGradient>
  <linearGradient id="gaugeArc" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#D4AF37"/>
    <stop offset="60%" stop-color="#F5E97A"/>
    <stop offset="100%" stop-color="#D4AF37"/>
  </linearGradient>
  <linearGradient id="gaugeArc2" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#F59E0B"/>
    <stop offset="100%" stop-color="#FCD34D"/>
  </linearGradient>
  <radialGradient id="gaugeGlow" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#D4AF37" stop-opacity=".12"/>
    <stop offset="100%" stop-color="#040812" stop-opacity="0"/>
  </radialGradient>
  <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
    <feGaussianBlur in="SourceAlpha" stdDeviation="4" result="b"/>
    <feFlood flood-color="#D4AF37" flood-opacity=".5" result="c"/>
    <feComposite in="c" in2="b" operator="in" result="s"/>
    <feMerge><feMergeNode in="s"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="cglow" x="-20%" y="-20%" width="140%" height="140%">
    <feGaussianBlur in="SourceAlpha" stdDeviation="3" result="b"/>
    <feFlood flood-color="#A5F3FC" flood-opacity=".6" result="c"/>
    <feComposite in="c" in2="b" operator="in" result="s"/>
    <feMerge><feMergeNode in="s"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <style>
    @keyframes arcDraw { from{stroke-dashoffset:502} to{stroke-dashoffset:12} }
    @keyframes arcDraw2 { from{stroke-dashoffset:502} to{stroke-dashoffset:26} }
    @keyframes numGlow { 0%,100%{filter:drop-shadow(0 0 6px #D4AF3760)} 50%{filter:drop-shadow(0 0 18px #D4AF37A0)} }
    @keyframes barGrow { from{width:0} to{width:var(--w)} }
    @keyframes cellFadeIn { from{opacity:0;transform:scale(.8)} to{opacity:1;transform:scale(1)} }
    @keyframes pulse { 0%,100%{opacity:.6} 50%{opacity:1} }
    @keyframes shimmer { 0%,100%{opacity:.7} 50%{opacity:1} }
    @keyframes borderPulse { 0%,100%{opacity:.3} 50%{opacity:.7} }
    .bar-anim { animation: none; }
    @keyframes growBar { from{transform:scaleX(0)} to{transform:scaleX(1)} }
  </style>
</defs>

<!-- BG -->
<rect width="1200" height="440" fill="url(#mlbg)"/>
<rect x="1" y="1" width="1198" height="438" rx="8" fill="none" stroke="#D4AF37" stroke-width=".8" stroke-opacity=".3" style="animation:borderPulse 4s ease-in-out infinite"/>

<!-- HEADER -->
<rect width="1200" height="52" fill="#070F1C"/>
<line x1="0" y1="52" x2="1200" y2="52" stroke="#D4AF37" stroke-width=".5" stroke-opacity=".3"/>
<text x="24" y="22" fill="#D4AF37" font-size="11" font-family="ui-monospace,monospace" letter-spacing="2">AI VETTING PERFORMANCE</text>
<text x="24" y="41" fill="#475569" font-size="10" font-family="ui-monospace,monospace" letter-spacing="1">LightGBM Classifier + TreeSHAP Explainability · Trained on 14,727 real catalog rows</text>
<text x="1176" y="32" text-anchor="end" fill="#34D399" font-size="10" font-family="ui-monospace,monospace">● LIVE</text>

<!-- SECTION DIVIDERS -->
<line x1="400" y1="52" x2="400" y2="380" stroke="#1E293B" stroke-width="1"/>
<line x1="800" y1="52" x2="800" y2="380" stroke="#1E293B" stroke-width="1"/>

<!-- ===== LEFT PANEL: ROC-AUC GAUGE ===== -->
<text x="200" y="90" text-anchor="middle" fill="#94A3B8" font-size="11" font-family="ui-monospace,monospace" letter-spacing="2">KOI ROC-AUC</text>

<!-- Gauge background arc (gray) -->
<path d="M 60,250 A 142,142 0 1,1 340,250" fill="none" stroke="#1E293B" stroke-width="18" stroke-linecap="round"/>
<!-- Gauge fill arc (gold) — 97.7% = 490/502 of arc -->
<path d="M 60,250 A 142,142 0 1,1 340,250" fill="none" stroke="url(#gaugeArc)" stroke-width="18" stroke-linecap="round"
      stroke-dasharray="490 502" stroke-dashoffset="502">
  <animate attributeName="stroke-dashoffset" from="502" to="12" dur="2s" fill="freeze" calcMode="spline" keySplines=".4,0,.2,1"/>
</path>
<!-- Inner glow circle -->
<circle cx="200" cy="230" r="80" fill="url(#gaugeGlow)"/>
<!-- Gauge center text -->
<text x="200" y="208" text-anchor="middle" fill="url(#gaugeArc)" font-size="52" font-family="ui-monospace,monospace" font-weight="700" style="animation:numGlow 3s ease-in-out infinite">0.977</text>
<text x="200" y="232" text-anchor="middle" fill="#94A3B8" font-size="12" font-family="ui-monospace,monospace">ROC-AUC</text>

<!-- Gauge tick labels -->
<text x="52" y="264" fill="#475569" font-size="9" font-family="ui-monospace,monospace">0.5</text>
<text x="181" y="102" fill="#475569" font-size="9" font-family="ui-monospace,monospace">0.75</text>
<text x="333" y="264" fill="#475569" font-size="9" font-family="ui-monospace,monospace">1.0</text>

<!-- TESS gauge below -->
<text x="200" y="295" text-anchor="middle" fill="#94A3B8" font-size="10" font-family="ui-monospace,monospace" letter-spacing="2">TESS v4 ROC-AUC</text>
<rect x="60" y="310" width="280" height="10" rx="5" fill="#1E293B"/>
<rect x="60" y="310" width="258" height="10" rx="5" fill="url(#gaugeArc2)">
  <animate attributeName="width" from="0" to="258" dur="1.8s" fill="freeze" begin=".5s" calcMode="spline" keySplines=".4,0,.2,1"/>
</rect>
<text x="200" y="338" text-anchor="middle" fill="#FCD34D" font-size="14" font-family="ui-monospace,monospace" font-weight="700">0.952</text>

<!-- ===== MIDDLE PANEL: CONFUSION MATRIX ===== -->
<text x="600" y="90" text-anchor="middle" fill="#94A3B8" font-size="11" font-family="ui-monospace,monospace" letter-spacing="2">CONFUSION MATRIX</text>
<text x="600" y="106" text-anchor="middle" fill="#334155" font-size="9" font-family="ui-monospace,monospace">KOI Hold-Out Test Set</text>

<!-- Column labels -->
<text x="510" y="130" text-anchor="middle" fill="#64748B" font-size="10" font-family="ui-monospace,monospace">Pred: Planet</text>
<text x="690" y="130" text-anchor="middle" fill="#64748B" font-size="10" font-family="ui-monospace,monospace">Pred: FP</text>
<text x="446" y="200" text-anchor="middle" fill="#64748B" font-size="10" font-family="ui-monospace,monospace" transform="rotate(-90,446,200)">Actual: Planet</text>
<text x="446" y="295" text-anchor="middle" fill="#64748B" font-size="10" font-family="ui-monospace,monospace" transform="rotate(-90,446,295)">Actual: FP</text>

<!-- TP cell (top-left, green) -->
<rect x="460" y="140" width="140" height="90" rx="6" fill="#052E16" stroke="#34D399" stroke-width="1.5" stroke-opacity=".7" opacity="0">
  <animate attributeName="opacity" from="0" to="1" dur=".5s" fill="freeze" begin=".3s"/>
</rect>
<text x="530" y="192" text-anchor="middle" fill="#34D399" font-size="34" font-family="ui-monospace,monospace" font-weight="700" opacity="0">
  109
  <animate attributeName="opacity" from="0" to="1" dur=".5s" fill="freeze" begin=".6s"/>
</text>
<text x="530" y="210" text-anchor="middle" fill="#166534" font-size="10" font-family="ui-monospace,monospace" opacity="0">
  TRUE POS
  <animate attributeName="opacity" from="0" to="1" dur=".5s" fill="freeze" begin=".8s"/>
</text>

<!-- FP cell (top-right, red) -->
<rect x="612" y="140" width="140" height="90" rx="6" fill="#2D0A0A" stroke="#F87171" stroke-width="1.5" stroke-opacity=".7" opacity="0">
  <animate attributeName="opacity" from="0" to="1" dur=".5s" fill="freeze" begin=".6s"/>
</rect>
<text x="682" y="192" text-anchor="middle" fill="#F87171" font-size="34" font-family="ui-monospace,monospace" font-weight="700" opacity="0">
  7
  <animate attributeName="opacity" from="0" to="1" dur=".5s" fill="freeze" begin=".9s"/>
</text>
<text x="682" y="210" text-anchor="middle" fill="#7F1D1D" font-size="10" font-family="ui-monospace,monospace" opacity="0">
  FALSE POS
  <animate attributeName="opacity" from="0" to="1" dur=".5s" fill="freeze" begin="1.1s"/>
</text>

<!-- FN cell (bottom-left, orange) -->
<rect x="460" y="242" width="140" height="90" rx="6" fill="#2D1A00" stroke="#F59E0B" stroke-width="1.5" stroke-opacity=".7" opacity="0">
  <animate attributeName="opacity" from="0" to="1" dur=".5s" fill="freeze" begin=".9s"/>
</rect>
<text x="530" y="294" text-anchor="middle" fill="#F59E0B" font-size="34" font-family="ui-monospace,monospace" font-weight="700" opacity="0">
  11
  <animate attributeName="opacity" from="0" to="1" dur=".5s" fill="freeze" begin="1.2s"/>
</text>
<text x="530" y="312" text-anchor="middle" fill="#78350F" font-size="10" font-family="ui-monospace,monospace" opacity="0">
  FALSE NEG
  <animate attributeName="opacity" from="0" to="1" dur=".5s" fill="freeze" begin="1.4s"/>
</text>

<!-- TN cell (bottom-right, blue) -->
<rect x="612" y="242" width="140" height="90" rx="6" fill="#071A2E" stroke="#60A5FA" stroke-width="1.5" stroke-opacity=".7" opacity="0">
  <animate attributeName="opacity" from="0" to="1" dur=".5s" fill="freeze" begin="1.2s"/>
</rect>
<text x="682" y="294" text-anchor="middle" fill="#60A5FA" font-size="34" font-family="ui-monospace,monospace" font-weight="700" opacity="0">
  57
  <animate attributeName="opacity" from="0" to="1" dur=".5s" fill="freeze" begin="1.5s"/>
</text>
<text x="682" y="312" text-anchor="middle" fill="#1E3A5F" font-size="10" font-family="ui-monospace,monospace" opacity="0">
  TRUE NEG
  <animate attributeName="opacity" from="0" to="1" dur=".5s" fill="freeze" begin="1.7s"/>
</text>

<!-- ===== RIGHT PANEL: SHAP FEATURES ===== -->
<text x="1000" y="90" text-anchor="middle" fill="#94A3B8" font-size="11" font-family="ui-monospace,monospace" letter-spacing="2">SHAP IMPORTANCE</text>
<text x="1000" y="106" text-anchor="middle" fill="#334155" font-size="9" font-family="ui-monospace,monospace">Top 8 Features (TreeSHAP)</text>

<!-- Feature bars - each uses stroke-dashoffset animation -->
<!-- Feature widths proportional (max = 320px) -->
<g font-family="ui-monospace,monospace" font-size="11">

  <!-- period -->
  <text x="820" y="140" fill="#94A3B8">period</text>
  <rect x="880" y="127" width="300" height="14" rx="3" fill="#1E293B"/>
  <rect x="880" y="127" width="300" height="14" rx="3" fill="#D4AF37" stroke="none" transform="scaleX(0)" style="transform-box:fill-box;transform-origin:left center;animation:growBar 1.2s .3s ease-out forwards">
    <animate attributeName="width" from="0" to="300" dur="1.2s" begin=".3s" fill="freeze" calcMode="spline" keySplines=".4,0,.2,1"/>
  </rect>
  <text x="1185" y="140" text-anchor="end" fill="#D4AF37" font-size="10">1.00</text>

  <!-- duration -->
  <text x="820" y="167" fill="#94A3B8">duration</text>
  <rect x="880" y="154" width="300" height="14" rx="3" fill="#1E293B"/>
  <rect x="880" y="154" width="0" height="14" rx="3" fill="#A5F3FC">
    <animate attributeName="width" from="0" to="252" dur="1.2s" begin=".5s" fill="freeze" calcMode="spline" keySplines=".4,0,.2,1"/>
  </rect>
  <text x="1185" y="167" text-anchor="end" fill="#A5F3FC" font-size="10">0.84</text>

  <!-- depth -->
  <text x="820" y="194" fill="#94A3B8">depth</text>
  <rect x="880" y="181" width="300" height="14" rx="3" fill="#1E293B"/>
  <rect x="880" y="181" width="0" height="14" rx="3" fill="#C084FC">
    <animate attributeName="width" from="0" to="219" dur="1.2s" begin=".7s" fill="freeze" calcMode="spline" keySplines=".4,0,.2,1"/>
  </rect>
  <text x="1185" y="194" text-anchor="end" fill="#C084FC" font-size="10">0.73</text>

  <!-- prad -->
  <text x="820" y="221" fill="#94A3B8">prad</text>
  <rect x="880" y="208" width="300" height="14" rx="3" fill="#1E293B"/>
  <rect x="880" y="208" width="0" height="14" rx="3" fill="#34D399">
    <animate attributeName="width" from="0" to="195" dur="1.2s" begin=".9s" fill="freeze" calcMode="spline" keySplines=".4,0,.2,1"/>
  </rect>
  <text x="1185" y="221" text-anchor="end" fill="#34D399" font-size="10">0.65</text>

  <!-- srad -->
  <text x="820" y="248" fill="#94A3B8">srad</text>
  <rect x="880" y="235" width="300" height="14" rx="3" fill="#1E293B"/>
  <rect x="880" y="235" width="0" height="14" rx="3" fill="#60A5FA">
    <animate attributeName="width" from="0" to="168" dur="1.2s" begin="1.1s" fill="freeze" calcMode="spline" keySplines=".4,0,.2,1"/>
  </rect>
  <text x="1185" y="248" text-anchor="end" fill="#60A5FA" font-size="10">0.56</text>

  <!-- steff -->
  <text x="820" y="275" fill="#94A3B8">steff</text>
  <rect x="880" y="262" width="300" height="14" rx="3" fill="#1E293B"/>
  <rect x="880" y="262" width="0" height="14" rx="3" fill="#F87171">
    <animate attributeName="width" from="0" to="138" dur="1.2s" begin="1.3s" fill="freeze" calcMode="spline" keySplines=".4,0,.2,1"/>
  </rect>
  <text x="1185" y="275" text-anchor="end" fill="#F87171" font-size="10">0.46</text>

  <!-- slogg -->
  <text x="820" y="302" fill="#94A3B8">slogg</text>
  <rect x="880" y="289" width="300" height="14" rx="3" fill="#1E293B"/>
  <rect x="880" y="289" width="0" height="14" rx="3" fill="#FB923C">
    <animate attributeName="width" from="0" to="108" dur="1.2s" begin="1.5s" fill="freeze" calcMode="spline" keySplines=".4,0,.2,1"/>
  </rect>
  <text x="1185" y="302" text-anchor="end" fill="#FB923C" font-size="10">0.36</text>

  <!-- snr -->
  <text x="820" y="329" fill="#94A3B8">snr</text>
  <rect x="880" y="316" width="300" height="14" rx="3" fill="#1E293B"/>
  <rect x="880" y="316" width="0" height="14" rx="3" fill="#E879F9">
    <animate attributeName="width" from="0" to="78" dur="1.2s" begin="1.7s" fill="freeze" calcMode="spline" keySplines=".4,0,.2,1"/>
  </rect>
  <text x="1185" y="329" text-anchor="end" fill="#E879F9" font-size="10">0.26</text>
</g>

<!-- BOTTOM METRICS ROW -->
<line x1="0" y1="380" x2="1200" y2="380" stroke="#1E293B" stroke-width="1"/>
<rect x="0" y="380" width="1200" height="60" fill="#050D1A"/>

<!-- 5 metric badges -->
<g font-family="ui-monospace,monospace">
  <!-- Accuracy -->
  <rect x="20" y="393" width="210" height="34" rx="5" fill="#0A1628" stroke="#D4AF37" stroke-width=".6" stroke-opacity=".4"/>
  <text x="34" y="406" fill="#64748B" font-size="8" letter-spacing="1">ACCURACY</text>
  <text x="34" y="421" fill="#D4AF37" font-size="16" font-weight="700">0.902</text>
  <text x="145" y="421" fill="#475569" font-size="8">· 90.2%</text>

  <!-- PR-AUC -->
  <rect x="250" y="393" width="210" height="34" rx="5" fill="#0A1628" stroke="#A5F3FC" stroke-width=".6" stroke-opacity=".4"/>
  <text x="264" y="406" fill="#64748B" font-size="8" letter-spacing="1">PR-AUC</text>
  <text x="264" y="421" fill="#A5F3FC" font-size="16" font-weight="700">0.907</text>
  <text x="345" y="421" fill="#475569" font-size="8">prec-recall</text>

  <!-- F1 Score -->
  <rect x="480" y="393" width="210" height="34" rx="5" fill="#0A1628" stroke="#34D399" stroke-width=".6" stroke-opacity=".4"/>
  <text x="494" y="406" fill="#64748B" font-size="8" letter-spacing="1">F1 SCORE</text>
  <text x="494" y="421" fill="#34D399" font-size="16" font-weight="700">0.864</text>
  <text x="560" y="421" fill="#475569" font-size="8">harmonic mean</text>

  <!-- Brier -->
  <rect x="710" y="393" width="210" height="34" rx="5" fill="#0A1628" stroke="#C084FC" stroke-width=".6" stroke-opacity=".4"/>
  <text x="724" y="406" fill="#64748B" font-size="8" letter-spacing="1">BRIER SCORE</text>
  <text x="724" y="421" fill="#C084FC" font-size="16" font-weight="700">0.079</text>
  <text x="800" y="421" fill="#475569" font-size="8">· calibrated</text>

  <!-- Model -->
  <rect x="940" y="393" width="240" height="34" rx="5" fill="#0A1628" stroke="#F59E0B" stroke-width=".6" stroke-opacity=".4"/>
  <text x="954" y="406" fill="#64748B" font-size="8" letter-spacing="1">MODEL</text>
  <text x="954" y="421" fill="#FCD34D" font-size="12" font-weight="700">LightGBM v4 · 8 feat</text>
</g>
</svg>
