<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="1200" height="520" role="img" aria-label="ASTRÆA End-to-End System Architecture Flow">
  <defs>
    <linearGradient id="archBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070B16"/>
      <stop offset="100%" stop-color="#10172A"/>
    </linearGradient>
    <marker id="arrowGold" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#D4AF37"/>
    </marker>
    <marker id="arrowCyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38BDF8"/>
    </marker>
    <marker id="arrowViolet" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#A78BFA"/>
    </marker>
  </defs>

  <rect width="1200" height="520" rx="16" fill="url(#archBg)" stroke="#334155" stroke-width="1.5"/>

  <!-- Title -->
  <text x="36" y="40" font-family="system-ui, sans-serif" font-size="19" font-weight="700" fill="#F8FAFC">End-to-End System Architecture &amp; Data Flow</text>
  <text x="36" y="60" font-family="ui-monospace, monospace" font-size="12" fill="#94A3B8">Parquet Data Lake  →  astro/ Physics &amp; ML  →  FastAPI + SQLite + SSE  →  Next.js 15 Proxy  →  React 19 Console</text>

  <!-- COLUMN 1: DATA LAKE -->
  <g transform="translate(36, 92)">
    <rect x="0" y="0" width="230" height="390" rx="12" fill="#0F172A" stroke="#3B82F6" stroke-opacity="0.55" stroke-width="1.5"/>
    <rect x="0" y="0" width="230" height="34" rx="12" fill="#1E3A8A" fill-opacity="0.55"/>
    <text x="16" y="22" font-family="ui-monospace, monospace" font-size="12" font-weight="700" fill="#93C5FD">1. DATA &amp; ARCHIVE LAYER</text>

    <rect x="16" y="50" width="198" height="72" rx="8" fill="#1E293B" stroke="#3B82F6" stroke-opacity="0.4"/>
    <text x="28" y="72" font-family="ui-monospace, monospace" font-size="12" font-weight="700" fill="#E2E8F0">koi_cumulative.parquet</text>
    <text x="28" y="92" font-family="system-ui, sans-serif" font-size="11" fill="#94A3B8">8,054 Kepler KOIs (154 cols)</text>
    <text x="28" y="109" font-family="system-ui, sans-serif" font-size="10.5" fill="#60A5FA">CONFIRMED / FP / CANDIDATE</text>

    <rect x="16" y="136" width="198" height="72" rx="8" fill="#1E293B" stroke="#D4AF37" stroke-opacity="0.4"/>
    <text x="28" y="158" font-family="ui-monospace, monospace" font-size="12" font-weight="700" fill="#FDE68A">ps_confirmed_default</text>
    <text x="28" y="178" font-family="system-ui, sans-serif" font-size="11" fill="#94A3B8">4,296 Confirmed (415 cols)</text>
    <text x="28" y="195" font-family="system-ui, sans-serif" font-size="10.5" fill="#FBBF24">NASA Exoplanet Archive</text>

    <rect x="16" y="222" width="198" height="72" rx="8" fill="#1E293B" stroke="#8B5CF6" stroke-opacity="0.4"/>
    <text x="28" y="244" font-family="ui-monospace, monospace" font-size="12" font-weight="700" fill="#DDD6FE">toi_catalog.parquet</text>
    <text x="28" y="264" font-family="system-ui, sans-serif" font-size="11" fill="#94A3B8">2,377 TESS TOIs (55 cols)</text>
    <text x="28" y="281" font-family="system-ui, sans-serif" font-size="10.5" fill="#A78BFA">Sector Transfer Target</text>

    <rect x="16" y="308" width="198" height="66" rx="8" fill="#090D1A" stroke="#10B981" stroke-opacity="0.4"/>
    <text x="28" y="330" font-family="ui-monospace, monospace" font-size="11.5" font-weight="700" fill="#6EE7B7">triage.sqlite3 + secret.key</text>
    <text x="28" y="349" font-family="system-ui, sans-serif" font-size="11" fill="#94A3B8">Human Verdicts, Notes &amp;</text>
    <text x="28" y="364" font-family="system-ui, sans-serif" font-size="11" fill="#94A3B8">scrypt Auth + HMAC Tokens</text>
  </g>

  <!-- Arrows Col 1 -> Col 2 -->
  <line x1="266" y1="220" x2="306" y2="220" stroke="#38BDF8" stroke-width="2" marker-end="url(#arrowCyan)"/>
  <line x1="266" y1="360" x2="306" y2="360" stroke="#D4AF37" stroke-width="2" marker-end="url(#arrowGold)"/>

  <!-- COLUMN 2: ASTRO SCIENTIFIC CORE -->
  <g transform="translate(310, 92)">
    <rect x="0" y="0" width="255" height="390" rx="12" fill="#0F172A" stroke="#D4AF37" stroke-opacity="0.55" stroke-width="1.5"/>
    <rect x="0" y="0" width="255" height="34" rx="12" fill="#78350F" fill-opacity="0.5"/>
    <text x="16" y="22" font-family="ui-monospace, monospace" font-size="12" font-weight="700" fill="#FDE68A">2. ASTRO SCIENTIFIC CORE</text>

    <rect x="16" y="50" width="223" height="102" rx="8" fill="#1E293B" stroke="#38BDF8" stroke-opacity="0.45"/>
    <text x="28" y="72" font-family="ui-monospace, monospace" font-size="12" font-weight="700" fill="#A5F3FC">Project A: Sky Change</text>
    <text x="28" y="92" font-family="system-ui, sans-serif" font-size="11" fill="#CBD5E1">• SPHEREx 102-Ch SED Synth</text>
    <text x="28" y="109" font-family="system-ui, sans-serif" font-size="11" fill="#CBD5E1">• Variability &amp; Anomaly Rank</text>
    <text x="28" y="126" font-family="system-ui, sans-serif" font-size="11" fill="#CBD5E1">• Moving Objects &amp; NEOWISE</text>
    <text x="28" y="143" font-family="system-ui, sans-serif" font-size="11" fill="#CBD5E1">• Quarantine &amp; Injection Test</text>

    <rect x="16" y="166" width="223" height="106" rx="8" fill="#1E293B" stroke="#D4AF37" stroke-opacity="0.45"/>
    <text x="28" y="188" font-family="ui-monospace, monospace" font-size="12" font-weight="700" fill="#FDE68A">Project B1: Physics Bridge</text>
    <text x="28" y="208" font-family="system-ui, sans-serif" font-size="11" fill="#CBD5E1">• Monte Carlo Error Sampler</text>
    <text x="28" y="225" font-family="system-ui, sans-serif" font-size="11" fill="#CBD5E1">• Chen-Kipping Mass Forecast</text>
    <text x="28" y="242" font-family="system-ui, sans-serif" font-size="11" fill="#CBD5E1">• Habitable Zone (HZ) Bounds</text>
    <text x="28" y="259" font-family="system-ui, sans-serif" font-size="11" fill="#CBD5E1">• T2 Composition &amp; TSM/ESM</text>

    <rect x="16" y="286" width="223" height="88" rx="8" fill="#1E293B" stroke="#10B981" stroke-opacity="0.45"/>
    <text x="28" y="308" font-family="ui-monospace, monospace" font-size="12" font-weight="700" fill="#6EE7B7">Project B2: Leak-Free ML</text>
    <text x="28" y="328" font-family="system-ui, sans-serif" font-size="11" fill="#CBD5E1">• 8-Observable LightGBM</text>
    <text x="28" y="345" font-family="system-ui, sans-serif" font-size="11" fill="#CBD5E1">• Exact TreeSHAP Contribs</text>
    <text x="28" y="362" font-family="system-ui, sans-serif" font-size="11" fill="#CBD5E1">• Split Conformal + TESS FEDA</text>
  </g>

  <!-- Arrows Col 2 -> Col 3 -->
  <line x1="565" y1="220" x2="605" y2="220" stroke="#D4AF37" stroke-width="2" marker-end="url(#arrowGold)"/>
  <line x1="565" y1="360" x2="605" y2="360" stroke="#38BDF8" stroke-width="2" marker-end="url(#arrowCyan)"/>

  <!-- COLUMN 3: FASTAPI BACKEND -->
  <g transform="translate(609, 92)">
    <rect x="0" y="0" width="255" height="390" rx="12" fill="#0F172A" stroke="#10B981" stroke-opacity="0.55" stroke-width="1.5"/>
    <rect x="0" y="0" width="255" height="34" rx="12" fill="#064E3B" fill-opacity="0.55"/>
    <text x="16" y="22" font-family="ui-monospace, monospace" font-size="12" font-weight="700" fill="#6EE7B7">3. FASTAPI ENGINE (:8000)</text>

    <rect x="16" y="50" width="223" height="74" rx="8" fill="#1E293B" stroke="#10B981" stroke-opacity="0.4"/>
    <text x="28" y="72" font-family="ui-monospace, monospace" font-size="12" font-weight="700" fill="#6EE7B7">routers/api.py (/api/v1)</text>
    <text x="28" y="92" font-family="system-ui, sans-serif" font-size="11" fill="#CBD5E1">/targets, /shap/{id}, /physics/{id}</text>
    <text x="28" y="109" font-family="system-ui, sans-serif" font-size="11" fill="#CBD5E1">/health, /model/info, /triage/{id}</text>

    <rect x="16" y="138" width="223" height="74" rx="8" fill="#1E293B" stroke="#38BDF8" stroke-opacity="0.4"/>
    <text x="28" y="160" font-family="ui-monospace, monospace" font-size="12" font-weight="700" fill="#A5F3FC">services/batch.py (SSE)</text>
    <text x="28" y="180" font-family="system-ui, sans-serif" font-size="11" fill="#CBD5E1">Asyncio 250-row chunk scoring</text>
    <text x="28" y="197" font-family="system-ui, sans-serif" font-size="11" fill="#CBD5E1">Live /batch/stream/{job_id}</text>

    <rect x="16" y="226" width="223" height="68" rx="8" fill="#1E293B" stroke="#F59E0B" stroke-opacity="0.4"/>
    <text x="28" y="248" font-family="ui-monospace, monospace" font-size="12" font-weight="700" fill="#FDE68A">Centroid Tripwire (&gt;3σ)</text>
    <text x="28" y="268" font-family="system-ui, sans-serif" font-size="11" fill="#CBD5E1">Difference-image blend guard</text>
    <text x="28" y="284" font-family="system-ui, sans-serif" font-size="11" fill="#CBD5E1">Flags targets for human review</text>

    <rect x="16" y="308" width="223" height="66" rx="8" fill="#1E293B" stroke="#A78BFA" stroke-opacity="0.4"/>
    <text x="28" y="330" font-family="ui-monospace, monospace" font-size="12" font-weight="700" fill="#DDD6FE">routers/auth.py + oauth.py</text>
    <text x="28" y="349" font-family="system-ui, sans-serif" font-size="11" fill="#CBD5E1">scrypt + HMAC Bearer + Guest</text>
    <text x="28" y="364" font-family="system-ui, sans-serif" font-size="11" fill="#CBD5E1">Google &amp; GitHub OAuth2 PKCE</text>
  </g>

  <!-- Arrows Col 3 -> Col 4 -->
  <line x1="864" y1="220" x2="904" y2="220" stroke="#A78BFA" stroke-width="2" marker-end="url(#arrowViolet)"/>
  <line x1="864" y1="360" x2="904" y2="360" stroke="#38BDF8" stroke-width="2" marker-end="url(#arrowCyan)"/>
  <text x="867" y="210" font-family="ui-monospace, monospace" font-size="9.5" fill="#A78BFA">REST</text>
  <text x="869" y="350" font-family="ui-monospace, monospace" font-size="9.5" fill="#38BDF8">SSE</text>

  <!-- COLUMN 4: NEXT.JS 15 CONSOLE -->
  <g transform="translate(908, 92)">
    <rect x="0" y="0" width="256" height="390" rx="12" fill="#0F172A" stroke="#A78BFA" stroke-opacity="0.55" stroke-width="1.5"/>
    <rect x="0" y="0" width="256" height="34" rx="12" fill="#4C1D95" fill-opacity="0.55"/>
    <text x="16" y="22" font-family="ui-monospace, monospace" font-size="12" font-weight="700" fill="#DDD6FE">4. NEXT.JS 15 CONSOLE (:3000)</text>

    <rect x="16" y="50" width="224" height="58" rx="8" fill="#1E293B" stroke="#A78BFA" stroke-opacity="0.4"/>
    <text x="28" y="70" font-family="ui-monospace, monospace" font-size="11.5" font-weight="700" fill="#DDD6FE">Zero-CORS API Proxy</text>
    <text x="28" y="90" font-family="system-ui, sans-serif" font-size="11" fill="#CBD5E1">/api/v1/:path* → 127.0.0.1:8000</text>

    <rect x="16" y="120" width="224" height="84" rx="8" fill="#1E293B" stroke="#38BDF8" stroke-opacity="0.4"/>
    <text x="28" y="140" font-family="ui-monospace, monospace" font-size="11.5" font-weight="700" fill="#A5F3FC">Interactive Science Views</text>
    <text x="28" y="158" font-family="system-ui, sans-serif" font-size="11" fill="#CBD5E1">• AladinSkyMap (CDS Sky Survey)</text>
    <text x="28" y="175" font-family="system-ui, sans-serif" font-size="11" fill="#CBD5E1">• PlotlyChart (SED &amp; Transit)</text>
    <text x="28" y="192" font-family="system-ui, sans-serif" font-size="11" fill="#CBD5E1">• ShapWaterfall (D3.js Force)</text>

    <rect x="16" y="216" width="224" height="74" rx="8" fill="#1E293B" stroke="#D4AF37" stroke-opacity="0.4"/>
    <text x="28" y="236" font-family="ui-monospace, monospace" font-size="11.5" font-weight="700" fill="#FDE68A">Operator Workflow HUD</text>
    <text x="28" y="255" font-family="system-ui, sans-serif" font-size="11" fill="#CBD5E1">• CatalogExplorer &amp; BatchScan</text>
    <text x="28" y="272" font-family="system-ui, sans-serif" font-size="11" fill="#CBD5E1">• TriagePanel &amp; TelemetryHeader</text>

    <rect x="16" y="302" width="224" height="72" rx="8" fill="#090D1A" stroke="#FBBF24" stroke-opacity="0.45"/>
    <text x="28" y="323" font-family="ui-monospace, monospace" font-size="11.5" font-weight="700" fill="#FDE68A">CosmicStarfield + Audio SFX</text>
    <text x="28" y="342" font-family="system-ui, sans-serif" font-size="11" fill="#CBD5E1">4 Themes (URJA, JUNGO, Dark, Light)</text>
    <text x="28" y="359" font-family="system-ui, sans-serif" font-size="11" fill="#CBD5E1">Zero-Alloc GPU Sprite Canvas</text>
  </g>
</svg>
